<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Edit text in PDFs and images directly in your browser. Upload, OCR, edit, and save — all client-side with no data leaving your device.">
  <title>DocEdit Pro — PDF & Image Text Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800;900&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
</head>
<body>

<div id="app">
  <!-- ===== Header ===== -->
  <header class="app-header" id="appHeader">
    <div class="app-logo">
      <div class="logo-icon">📝</div>
      <h1>DocEdit Pro</h1>
      <span class="badge">Beta</span>
    </div>

    <!-- Navigation Switcher -->
    <nav class="app-nav">
      <a href="index.html" class="nav-tab active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <span>PDF Editor</span>
      </a>
      <a href="receipt.html" class="nav-tab">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/>
          <line x1="8" y1="7" x2="16" y2="7"/>
          <line x1="8" y1="11" x2="16" y2="11"/>
        </svg>
        <span>Receipt Generator</span>
      </a>
    </nav>

    <div class="header-actions" id="headerActions">
      <!-- File info (shown when file is loaded) -->
      <div class="file-info" id="fileInfo" style="display:none;">
        <span class="file-icon">📄</span>
        <span class="file-name" id="fileName"></span>
      </div>

      <!-- New file button -->
      <button class="btn btn-ghost btn-icon" id="btnNewFile" data-tooltip="Upload New File" style="display:none;" aria-label="Upload new file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
      </button>

      <!-- Save button -->
      <button class="btn btn-primary" id="btnSave" style="display:none;" aria-label="Save and Download">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span class="btn-save-text">Save & Download</span>
        <span class="btn-save-text-mobile" style="display:none;">Save</span>
      </button>
    </div>
  </header>

  <!-- ===== Main Content ===== -->
  <div class="main-content">

    <!-- Upload Screen -->
    <div class="upload-screen" id="uploadScreen">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <h2 class="upload-title">Drop your file here</h2>
        <p class="upload-subtitle">or click to browse your files</p>
        <span class="upload-or">Supported formats</span>
        <div class="upload-formats">
          <span class="format-tag">PDF</span>
          <span class="format-tag">JPEG</span>
          <span class="format-tag">PNG</span>
          <span class="format-tag">WebP</span>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp">
      </div>
    </div>

    <!-- Editor Screen -->
    <div class="editor-screen" id="editorScreen">
      <!-- Toolbar -->
      <div class="editor-toolbar" id="editorToolbar">
        <!-- Page Navigation -->
        <div class="toolbar-group" id="pageNavGroup" style="display:none;">
          <span class="toolbar-label">Page</span>
          <button class="btn btn-ghost btn-icon" id="btnPrevPage" data-tooltip="Previous Page" aria-label="Previous page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <span class="page-indicator" id="pageIndicator">1 / 1</span>
          <button class="btn btn-ghost btn-icon" id="btnNextPage" data-tooltip="Next Page" aria-label="Next page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
          <div class="toolbar-divider"></div>
        </div>

        <!-- Zoom -->
        <div class="toolbar-group">
          <span class="toolbar-label">Zoom</span>
          <button class="btn btn-ghost btn-icon" id="btnZoomOut" data-tooltip="Zoom Out" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </button>
          <span class="zoom-value" id="zoomValue">100%</span>
          <button class="btn btn-ghost btn-icon" id="btnZoomIn" data-tooltip="Zoom In" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="11" y1="8" x2="11" y2="14"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </button>
          <button class="btn btn-ghost btn-icon" id="btnZoomFit" data-tooltip="Fit to Width" aria-label="Fit to width">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Undo/Redo -->
        <div class="toolbar-group">
          <button class="btn btn-ghost btn-icon" id="btnUndo" data-tooltip="Undo (⌘Z)" disabled aria-label="Undo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
          </button>
          <button class="btn btn-ghost btn-icon" id="btnRedo" data-tooltip="Redo (⌘⇧Z)" disabled aria-label="Redo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>

        <!-- Font & Formatting Controls -->
        <div class="toolbar-divider"></div>
        <div class="toolbar-group font-toolbar-group" id="fontToolbarGroup">
          <span class="toolbar-label">Font</span>
          <!-- Font Style Select -->
          <select class="toolbar-select font-family-select" id="fontFamilySelect" data-tooltip="Change Font Style" aria-label="Font Style">
            <option value="sans-serif">Clean Sans (Arial / Standard)</option>
            <option value="inter">Inter (Modern Sans)</option>
            <option value="pos-thermal">POS Thermal (Chivo Mono)</option>
            <option value="space-mono">Space Mono (Receipt Numbers)</option>
            <option value="courier">Courier Prime (Typewriter / POS)</option>
            <option value="dot-matrix">Dot Matrix / VT323</option>
            <option value="serif">Times New Roman (Serif)</option>
            <option value="monospace">Consolas / Code Mono</option>
          </select>

          <!-- Font Size Stepper -->
          <div class="font-size-stepper" data-tooltip="Decrease / Increase Font Size">
            <button class="btn btn-ghost btn-icon btn-stepper" id="btnFontSizeDec" title="Decrease Font Size ([)" aria-label="Decrease Font Size">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <input type="number" id="fontSizeInput" class="font-size-input" value="14" min="6" max="120" step="1" title="Font size in pixels" aria-label="Font Size in pixels">
            <span class="font-size-unit">px</span>
            <button class="btn btn-ghost btn-icon btn-stepper" id="btnFontSizeInc" title="Increase Font Size (])" aria-label="Increase Font Size">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>

          <!-- Bold & Italic -->
          <button class="btn btn-ghost btn-icon btn-format-toggle" id="btnFontBold" data-tooltip="Bold (⌘B)" aria-label="Toggle Bold">
            <span class="format-letter-icon bold">B</span>
          </button>
          <button class="btn btn-ghost btn-icon btn-format-toggle" id="btnFontItalic" data-tooltip="Italic (⌘I)" aria-label="Toggle Italic">
            <span class="format-letter-icon italic">I</span>
          </button>

          <!-- Reset / Match Original -->
          <button class="btn btn-ghost btn-icon" id="btnResetWordStyle" data-tooltip="Reset to Detected Style & Shade" aria-label="Reset to detected style">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>

          <div class="toolbar-divider"></div>

          <!-- Character Darkness / Lightness (Ink Shade) -->
          <div class="ink-shade-group" data-tooltip="Character Darkness & Lightness">
            <span class="toolbar-label">Shade</span>
            <button class="btn btn-ghost btn-icon btn-shade" id="btnShadeDarker" data-tooltip="Make Characters Darker" aria-label="Make Characters Darker">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>
              </svg>
            </button>
            <span class="ink-shade-value" id="inkShadeValue" title="Darkness Level">100%</span>
            <button class="btn btn-ghost btn-icon btn-shade" id="btnShadeLighter" data-tooltip="Make Characters Lighter" aria-label="Make Characters Lighter">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9"/>
                <circle cx="12" cy="12" r="3.5" fill="currentColor"/>
              </svg>
            </button>
            <label class="color-picker-label" title="Custom Character Color">
              <input type="color" id="textColorPicker" class="color-picker-input" value="#000000">
              <span class="color-picker-swatch" id="colorPickerSwatch"></span>
            </label>
          </div>
        </div>

        <!-- Add Text Tool -->
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button class="btn btn-ghost" id="btnAddText" data-tooltip="Click anywhere on the document to add new text box" aria-label="Add Text">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span style="font-size: 12px; font-weight: 500; margin-left: 2px;">+ Text</span>
          </button>
        </div>

        <div style="flex:1;"></div>

        <!-- Toggle side panel -->
        <div class="toolbar-group">
          <button class="btn btn-ghost" id="btnTogglePanel" data-tooltip="Toggle Text Panel">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="15" y1="3" x2="15" y2="21"/>
            </svg>
            Text Panel
          </button>
        </div>
      </div>

      <!-- Editor Body -->
      <div class="editor-body">
        <!-- Canvas Viewport -->
        <div class="canvas-viewport" id="canvasViewport">
          <div class="canvas-container" id="canvasContainer">
            <canvas id="mainCanvas"></canvas>
            <div class="text-overlay" id="textOverlay"></div>

            <!-- Floating Word Quick Toolbar -->
            <div class="floating-word-toolbar" id="floatingWordToolbar" style="display:none;">
              <select class="floating-font-select" id="floatingFontSelect" title="Change Font Style">
                <option value="sans-serif">Clean Sans</option>
                <option value="inter">Inter</option>
                <option value="pos-thermal">POS Thermal</option>
                <option value="space-mono">Space Mono</option>
                <option value="courier">Courier</option>
                <option value="dot-matrix">Dot Matrix</option>
                <option value="serif">Times Roman</option>
                <option value="monospace">Consolas</option>
              </select>
              <div class="floating-divider"></div>
              <button class="floating-btn" id="floatingBtnDec" title="Decrease Font Size ([)" aria-label="Decrease Font Size">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <span class="floating-size-badge" id="floatingSizeBadge" title="Current Font Size">14px</span>
              <button class="floating-btn" id="floatingBtnInc" title="Increase Font Size (])" aria-label="Increase Font Size">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <div class="floating-divider"></div>
              <button class="floating-btn floating-format-btn" id="floatingBtnBold" title="Bold (⌘B)"><b>B</b></button>
              <button class="floating-btn floating-format-btn" id="floatingBtnItalic" title="Italic (⌘I)"><i>I</i></button>
              <div class="floating-divider"></div>
              <!-- Floating Darker / Lighter -->
              <button class="floating-btn" id="floatingBtnDarker" title="Darker Characters" aria-label="Darker">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9"/>
                  <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>
                </svg>
              </button>
              <span class="floating-shade-badge" id="floatingShadeBadge" title="Darkness Level">100%</span>
              <button class="floating-btn" id="floatingBtnLighter" title="Lighter Characters" aria-label="Lighter">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9"/>
                  <circle cx="12" cy="12" r="3.5" fill="currentColor"/>
                </svg>
              </button>
              <button class="floating-btn" id="floatingBtnReset" title="Reset to Detected Style & Shade" aria-label="Reset to original">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                  <path d="M3 3v5h5"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Side Panel Backdrop (Mobile) -->
        <div class="side-panel-backdrop" id="sidePanelBackdrop"></div>

        <!-- Side Panel -->
        <aside class="side-panel" id="sidePanel">
          <div class="side-panel-header">
            <h3>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Extracted Text
              <span class="word-count" id="wordCount"></span>
            </h3>
            <button class="btn btn-ghost btn-icon" id="btnClosePanel" data-tooltip="Close Panel" aria-label="Close panel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
          <div class="side-panel-content" id="sidePanelContent">
            <div class="line-editor" id="lineEditor">
              <!-- Lines will be populated by JS -->
            </div>
          </div>
        </aside>
      </div>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <h3 class="loading-title" id="loadingTitle">Processing Document</h3>
      <p class="loading-status" id="loadingStatus">Initializing OCR engine...</p>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText">0%</p>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>
</div>

<!-- External Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<!-- App -->
<script src="app.js?v=11" type="module"></script>
<!-- Analytics Tracker -->
<script src="tracker.js" defer></script>

</body>
</html>
